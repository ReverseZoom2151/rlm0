[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlm0"
version = "0.1.0"
description = "A bounded runtime for Recursive Language Models with a depth-0 control, shared budgets, parallel subcalls, and isolated Python execution"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ReverseZoom2151" }]
keywords = [
    "recursive-language-models",
    "long-context",
    "llm",
    "repl",
    "agents",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
rlm0 = "rlm0.cli:main"

[project.urls]
Homepage = "https://github.com/ReverseZoom2151/rlm0"
Repository = "https://github.com/ReverseZoom2151/rlm0"
Issues = "https://github.com/ReverseZoom2151/rlm0/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm0"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rlm0",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
