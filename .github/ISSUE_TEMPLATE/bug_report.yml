name: Bug report
description: Report a reproducible defect without including private context or credentials.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, unredacted prompts, or confidential context. Attach a redacted run record when possible.
  - type: input
    id: version
    attributes:
      label: rlm0 version and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and redacted configuration
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
